function dlogX(){const u=PQ.u,dn=u.r=='HOD'?u.d:'',m=PQ.dl.m,inM=d=>!m||String(d||'').startsWith(m),T=(PQ.dl.trips||[]).filter(t=>inM(t.date)),B=PQ.reqs.filter(o=>(!dn||o.dept==dn)&&o.veh&&!STP.includes(o.status)&&inM(o.pd));return [['BOOKINGS'],['Pick up date','Pick up time','Return date','Return time','Vehicle','Driver','Driver phone','Requested by','Place','City','Request No','Status'],...B.map(o=>[o.pd,o.pt,o.rd,o.rt,o.veh,o.drv,o.drvph||'',o.name,o.place,o.city,o.no,o.status]),[''],['DRIVER TRIP LOG'],['Date','Start','End','Vehicle','Driver','From','To','Purpose','KM','Duration (min)'],...T.map(t=>[t.date,t.tst,t.tet,t.v,t.drv,t.from,t.to,t.pur,t.km,t.dur])].map(r=>r.map(x=>String(x==null?'':x).replace(/\t/g,' ')).join('\t')).join('\n')}
